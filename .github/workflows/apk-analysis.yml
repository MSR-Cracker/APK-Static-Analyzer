name: "APK / APKS Static Analysis"

on:
  workflow_dispatch:

jobs:
  analyze:
    name: "Perform Deep Static Analysis"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Python Dependencies"
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: "Validate Target Input File"
        run: |
          mkdir -p input
          if [ ! -f "input/app.apk" ] && [ ! -f "input/app.apks" ] && [ -z "$(ls -A input/*.apk input/*.apks 2>/dev/null)" ]; then
            echo "::error ::No APK or APKS target found in input/ directory. Please place input/app.apk or input/app.apks before running."
            exit 1
          fi
          echo "Target input file confirmed."

      - name: "Run Deep Static Analysis Pipeline"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python analyze.py

      - name: "Publish Job Summary"
        if: always()
        run: |
          if [ -f "output/analysis.json" ]; then
            python -c '
import json
with open("output/analysis.json") as f:
    d = json.load(f)
apk = d.get("apk_info", {})
billing = d.get("billing", {})
cls = d.get("class_analysis", {})
clf = d.get("classification", {})
verifs = d.get("boolean_verification_locations", [])
ctors = d.get("constructors", [])
obf = d.get("obfuscation", {})
ai = d.get("ai_reasoning", {})

summary = f"""### APK ANALYSIS SUMMARY
- **Package**: `{apk.get("package_name", "Unknown")}`
- **Version**: `{apk.get("version_name", "N/A")} ({apk.get("version_code", "N/A")})`
- **DEX count**: `{len(d.get("dex_files", []))}`
- **Obfuscated**: `{obf.get("status", "NO")}`
- **Billing detected**: `{", ".join(billing.get("providers_detected", [])) or "None"}`
- **Payment architecture**: `{clf.get("classification", "UNKNOWN")}`

- **Primary purchase class**: `{cls.get("primary_purchase_class", "None")}`
- **Primary purchase method**: `{cls.get("primary_boolean_method", "None")}`
- **DEX**: `{cls.get("primary_boolean_dex", "N/A")}`
- **Signature**: `{cls.get("primary_boolean_signature", "()Z")}`

- **Boolean verification**: `{verifs[0]["class_name"] + "->" + verifs[0]["method_name"] if verifs else "None detected"}`
- **Constructor premium check**: `{ctors[0]["verification"] if ctors else "NO"}`

- **Confidence**: `{clf.get("confidence", "LOW")}`
"""
with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as out:
    out.write(summary)
'
          fi

      - name: "Upload Analysis Artifacts"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "static-analysis-reports"
          path: |
            output/analysis.json
            output/report.html
          retention-days: 30
